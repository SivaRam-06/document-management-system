{% extends "base.html" %}
{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block body %}
<div class="error-page">
    <div class="fade-in">
        <div class="error-code">{{ code }}</div>
        <h2 class="mb-3">{{ title }}</h2>
        <p class="text-muted mb-4">{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-gradient btn-lg"><i class="bi bi-house me-2"></i>Return Home</a>
    </div>
</div>
{% endblock %}
